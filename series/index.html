    <!-- View Switcher Script (Grid vs Compact List) -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const contentGrid = document.getElementById("contentGrid");
            const btnGridView = document.getElementById("btnGridView");
            const btnListView = document.getElementById("btnListView");

            function setViewMode(mode) {
                if (!contentGrid || !btnGridView || !btnListView) return;
                if (mode === "list") {
                    contentGrid.classList.add("is-list-view");
                    btnListView.classList.add("active");
                    btnGridView.classList.remove("active");
                    localStorage.setItem("ashame_view_mode", "list");
                } else {
                    contentGrid.classList.remove("is-list-view");
                    btnGridView.classList.add("active");
                    btnListView.classList.remove("active");
                    localStorage.setItem("ashame_view_mode", "grid");
                }
            }

            if (btnGridView && btnListView) {
                btnGridView.addEventListener("click", () => setViewMode("grid"));
                btnListView.addEventListener("click", () => setViewMode("list"));

                // Load preferensi tersimpan
                const savedView = localStorage.getItem("ashame_view_mode");
                if (savedView === "list") {
                    setViewMode("list");
                }
            }
        });
    </script>
